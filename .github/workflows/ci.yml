name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The mobile package's lint/typecheck/test/build scripts all shell out to
      # `flutter`, so without this the whole job fails at @weunite/mobile#lint
      # with "flutter: not found".
      # `flutter build apk` needs the Android SDK, and the runner does not point
      # ANDROID_HOME at its preinstalled copy on its own.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Fetch Flutter packages
        run: flutter pub get
        working-directory: apps/mobile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
