name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The mobile package's lint/typecheck/test/build scripts all shell out to
      # `flutter`, so without this the whole job fails at @weunite/mobile#lint
      # with "flutter: not found".
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Fetch Flutter packages
        run: flutter pub get
        working-directory: apps/mobile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The mobile package is covered above by lint, typecheck and its test
      # suite. Its `build` script produces an Android APK, which needs a full
      # Android SDK/NDK that this runner image does not provide (Flutter reports
      # "No Android SDK found" even with ANDROID_HOME exported, and
      # setup-android@v3 fails on its own sdkmanager call). Build the APK
      # locally or from a dedicated release workflow - see MOBILE_TESTING.md.
      - name: Build
        run: pnpm exec turbo run build --filter=!@weunite/mobile
