services:
  db:
    image: postgres:15
    container_name: weunite-api-postgres
    restart: unless-stopped
    ports:
      - "${API_DB_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_DOCKER_NAME:-weunite}
      POSTGRES_USER: ${DB_DOCKER_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_DOCKER_PASSWORD:-postgres}
    volumes:
      - weunite_api_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: weunite-api:local
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_DOCKER_NAME:-weunite}
      DB_USERNAME: ${DB_DOCKER_USERNAME:-postgres}
      DB_PASSWORD: ${DB_DOCKER_PASSWORD:-postgres}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${API_ONLY_HOST_PORT:-8081}:8080"

volumes:
  weunite_api_postgres_data:
