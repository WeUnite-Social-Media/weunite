services:
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
      target: dev
    container_name: weunite-api
    env_file:
      - ../../.env
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_HOST: ${LOCAL_DB_HOST_FOR_DOCKER:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-weunite}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    volumes:
      - ../../apps/api:/workspace
      - weunite_maven_repo:/root/.m2

volumes:
  weunite_maven_repo:
